name: build

on:
  push:
    branches: [ "main", "competition-2025" ]
  pull_request:
    branches: [ "main", "competition-2025" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  contents: read
  actions: write

jobs:
  init-ubuntu:
    runs-on: ubuntu-latest
    name: init-ubuntu
    outputs:
      cache-key: ${{ steps.build-cache.outputs.cache-key }}
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup build cache
      id: build-cache
      run: |
        echo "cache-key=build-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**', 'deps/3rd/**', 'build.sh') }}" >> $GITHUB_OUTPUT
    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          deps/3rd/usr/local
          build_debug
          build_release
        key: ${{ steps.build-cache.outputs.cache-key }}
        restore-keys: |
          build-${{ runner.os }}-
          build-
    - name: Init
      shell: bash
      run: sudo bash build.sh init
    - name: Upload deps artifact (fallback for fork PR)
      uses: actions/upload-artifact@v4
      with:
        name: deps-${{ runner.os }}
        path: deps/3rd/usr/local
        retention-days: 7

  build-and-test-on-ubuntu:
    runs-on: ubuntu-latest
    name: build-and-test-on-ubuntu
    needs: init-ubuntu

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache build dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          deps/3rd/usr/local
          build_debug
        key: ${{ needs.init-ubuntu.outputs.cache-key }}
        restore-keys: |
          build-${{ runner.os }}-
          build-
    - name: Download deps artifact if cache missed
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/download-artifact@v4
      with:
        name: deps-${{ runner.os }}
        path: deps/3rd/usr/local
    - name: BuildDebug
      shell: bash
      run: bash build.sh debug -DCONCURRENCY=ON -DENABLE_COVERAGE=ON -DWITH_BENCHMARK=ON -DWITH_MEMTRACER=ON -DWITH_UNIT_TESTS=ON --make -j4

    - name: Test
      shell: bash
      run: |
        cd build_debug
        ctest -E memtracer_test --verbose
    - name: lcov
      shell: bash
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update && sudo apt-get install -y lcov
        cd build_debug
        rm -rf unittest
        lcov -c -d ./ -o coverage.info --ignore-errors source
    - uses: codecov/codecov-action@v3
      with:
        file: build_debug/coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}

  build-release:
    runs-on: ubuntu-latest
    name: build-release-ubuntu
    needs: init-ubuntu

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache build dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          deps/3rd/usr/local
          build_release
        key: ${{ needs.init-ubuntu.outputs.cache-key }}
        restore-keys: |
          build-${{ runner.os }}-
          build-
    - name: Download deps artifact if cache missed
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/download-artifact@v4
      with:
        name: deps-${{ runner.os }}
        path: deps/3rd/usr/local
    - name: BuildRelease
      shell: bash
      run: bash build.sh release -DCONCURRENCY=ON -DWITH_UNIT_TESTS=ON -DWITH_BENCHMARK=ON -DENABLE_ASAN=OFF -DWITH_MEMTRACER=ON --make -j4

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-release-artifacts
        path: |
          build_release/
          deps/3rd/usr/local/
        retention-days: 7

  basic-test:
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-release-artifacts
          path: ./

      - name: Fix permissions
        shell: bash
        run: |
          chmod +x build_release/bin/* || true
          chmod +x build_release/benchmark/* || true
          chmod +x build_release/unittest/* || true
          find build_release -name "*.so" -exec chmod +x {} \; || true
          find build_release -name "*.a" -exec chmod +x {} \; || true
      - name: run basic test
        shell: bash
        run: |
          echo "begin test..."
          python3 test/case/miniob_test.py --test-cases=basic | tail -1 | grep "basic is success"
  sysbench-test:
    needs: [build-release]
    strategy:
      matrix:
        include:
          # 基础sysbench测试
          - thread_model: 'one-thread-per-connection'
            test_case: 'miniob_insert'
            build_type: 'release'
            memtracer: ''
          - thread_model: 'one-thread-per-connection'
            test_case: 'miniob_delete'
            build_type: 'release'
            memtracer: ''
          - thread_model: 'one-thread-per-connection'
            test_case: 'miniob_select'
            build_type: 'release'
            memtracer: ''
          - thread_model: 'java-thread-pool'
            test_case: 'miniob_insert'
            build_type: 'release'
            memtracer: ''
          - thread_model: 'java-thread-pool'
            test_case: 'miniob_delete'
            build_type: 'release'
            memtracer: ''
          - thread_model: 'java-thread-pool'
            test_case: 'miniob_select'
            build_type: 'release'
            memtracer: ''
          # memtracer sysbench测试
          - thread_model: 'one-thread-per-connection'
            test_case: 'miniob_insert'
            build_type: 'release'
            memtracer: 'LD_PRELOAD=./lib/libmemtracer.so'

    runs-on: ubuntu-latest
    name: sysbench-test-${{ matrix.build_type }}-${{ matrix.thread_model }}-${{ matrix.test_case }}-${{ matrix.memtracer == '' && 'normal' || 'memtracer' }}
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.build_type == 'debug' && 'build-debug-artifacts' || 'build-release-artifacts' }}
          path: ./

      - name: Fix permissions
        shell: bash
        run: |
          chmod +x build_release/bin/* || true
          chmod +x build_release/benchmark/* || true
          chmod +x build_release/unittest/* || true
          find build_release -name "*.so" -exec chmod +x {} \; || true
          find build_release -name "*.a" -exec chmod +x {} \; || true

      - name: run sysbench test
        shell: bash
        run: |
          echo "begin test..."
          cd build_release && ${{ matrix.memtracer }} ./bin/observer -f ../etc/observer.ini &
          sleep 5
          cd ../../test/sysbench && ${{ matrix.memtracer }} sysbench ${sysbench_args} --mysql-host=127.0.0.1 --mysql-port=6789 --mysql-user=root --threads=10 --time=30 --report-interval=10 ${matrix.test_case}.lua run | tail -1 | grep "transactions:"
          killall observer || true